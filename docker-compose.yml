services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-virgosoft}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virgosoft}
            POSTGRES_DB: ${POSTGRES_DB:-virgosoft}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - virgosoft-postgres:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:-virgosoft} -d ${POSTGRES_DB:-virgosoft}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    virgosoft-postgres:
