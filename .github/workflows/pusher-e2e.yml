name: Hosted Pusher E2E

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    pusher-e2e:
        runs-on: ubuntu-latest
        env:
            APP_ENV: testing
            APP_URL: http://127.0.0.1:8080
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_DATABASE: virgosoft_e2e
            DB_USERNAME: virgosoft
            DB_PASSWORD: virgosoft
            E2E_DB_DATABASE: virgosoft_e2e
            BROADCAST_CONNECTION: pusher
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            SESSION_DRIVER: database
            PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
            PUSHER_APP_KEY: ${{ secrets.PUSHER_APP_KEY }}
            PUSHER_APP_SECRET: ${{ secrets.PUSHER_APP_SECRET }}
            PUSHER_APP_CLUSTER: ${{ secrets.PUSHER_APP_CLUSTER }}
            PUSHER_HOST: ''
            PUSHER_PORT: 443
            PUSHER_SCHEME: https
            VITE_PUSHER_APP_KEY: ${{ secrets.PUSHER_APP_KEY }}
            VITE_PUSHER_APP_CLUSTER: ${{ secrets.PUSHER_APP_CLUSTER }}
            VITE_PUSHER_HOST: ''
            VITE_PUSHER_PORT: 443
            VITE_PUSHER_SCHEME: https
            VITE_E2E: 'true'
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: virgosoft
                    POSTGRES_PASSWORD: virgosoft
                    POSTGRES_DB: virgosoft
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: '8.5'
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'

            - name: Install application dependencies
              run: |
                  composer install --no-interaction --prefer-dist --optimize-autoloader
                  npm ci

            - name: Configure isolated hosted-Pusher environment
              env:
                  PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
                  PUSHER_APP_KEY: ${{ secrets.PUSHER_APP_KEY }}
                  PUSHER_APP_SECRET: ${{ secrets.PUSHER_APP_SECRET }}
                  PUSHER_APP_CLUSTER: ${{ secrets.PUSHER_APP_CLUSTER }}
              run: |
                  test -n "$PUSHER_APP_ID"
                  test -n "$PUSHER_APP_KEY"
                  test -n "$PUSHER_APP_SECRET"
                  test -n "$PUSHER_APP_CLUSTER"
                  cp .env.testing.example .env
                  php artisan key:generate --force
                  sed -i -E 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8080|' .env
                  sed -i -E 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
                  sed -i -E 's|^DB_DATABASE=.*|DB_DATABASE=virgosoft_e2e|' .env
                  sed -i -E 's|^BROADCAST_CONNECTION=.*|BROADCAST_CONNECTION=pusher|' .env
                  sed -i -E 's|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=database|' .env
                  sed -i -E 's|^SESSION_DRIVER=.*|SESSION_DRIVER=database|' .env
                  sed -i -E 's|^CACHE_STORE=.*|CACHE_STORE=database|' .env
                  cat >> .env <<EOF
                  PUSHER_APP_ID=$PUSHER_APP_ID
                  PUSHER_APP_KEY=$PUSHER_APP_KEY
                  PUSHER_APP_SECRET=$PUSHER_APP_SECRET
                  PUSHER_APP_CLUSTER=$PUSHER_APP_CLUSTER
                  PUSHER_HOST=
                  PUSHER_PORT=443
                  PUSHER_SCHEME=https
                  VITE_PUSHER_APP_KEY=$PUSHER_APP_KEY
                  VITE_PUSHER_APP_CLUSTER=$PUSHER_APP_CLUSTER
                  VITE_PUSHER_HOST=
                  VITE_PUSHER_PORT=443
                  VITE_PUSHER_SCHEME=https
                  EOF

            - name: Create E2E database
              run: |
                  if ! PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USERNAME" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_DATABASE'" | grep -q 1; then
                    PGPASSWORD="$DB_PASSWORD" createdb -h "$DB_HOST" -U "$DB_USERNAME" "$DB_DATABASE"
                  fi

            - name: Migrate and seed E2E database
              run: npm run e2e:prepare

            - name: Build frontend assets
              run: npm run build

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium webkit

            - name: Check browser-test types
              run: npm run types:e2e

            - name: Start queue worker
              run: |
                  php artisan queue:work --queue=default,emails --tries=1 --timeout=120 > storage/logs/pusher-e2e-queue.log 2>&1 &
                  echo $! > storage/logs/pusher-e2e-queue.pid

            - name: Run browser tests against hosted Pusher
              run: npm run test:e2e

            - name: Upload hosted-Pusher artifacts
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: hosted-pusher-e2e-artifacts
                  path: |
                      playwright-report/
                      test-results/
                      storage/logs/pusher-e2e-*.log
                      storage/logs/e2e-server.log
                  if-no-files-found: ignore
