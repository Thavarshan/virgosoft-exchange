name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: virgosoft
          POSTGRES_PASSWORD: virgosoft
          POSTGRES_DB: virgosoft
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup environment
        run: cp .env.testing.example .env

      - name: Create test database
        run: PGPASSWORD=virgosoft psql -h 127.0.0.1 -U virgosoft -d virgosoft -c 'CREATE DATABASE virgosoft_testing;'

      - name: Generate application key and migrate
        run: php artisan key:generate && php artisan migrate --force

      - name: Install frontend dependencies
        run: npm ci

      - name: Run CI Checks
        run: composer ci:check
